name: waterhub-backend

services:
  backend:
    image: waterhub-backend:develop
    # Keep the development container alive without starting Zope. Start it
    # explicitly from an interactive shell with ./docker-entrypoint.sh start.
    entrypoint: ["/usr/bin/tail", "-f", "/dev/null"]
    build:
      context: .
      dockerfile: develop/Dockerfile
      args:
        PLONE_IMAGE: ${PLONE_IMAGE:-eeacms/plone-backend:6.1.4-16}
    environment:
      SITE: Plone
      PROFILES: eea.waterhub.policy:default
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - data:/data
      - ./sources/eea.waterhub.policy:/app/sources/eea.waterhub.policy
    restart: unless-stopped

volumes:
  data:
    name: waterhub-backend-data

