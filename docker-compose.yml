name: waterhub-backend

services:
  backend:
    image: waterhub-backend:develop
    build:
      context: .
      dockerfile: develop/Dockerfile
      args:
        PLONE_IMAGE: ${PLONE_IMAGE:-eeacms/plone-backend:latest}
    environment:
      SITE: Plone
      PROFILES: eea.waterhub.policy:default
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - data:/data
      - ./sources/eea.waterhub.policy:/app/sources/eea.waterhub.policy
    restart: unless-stopped

volumes:
  data:
    name: waterhub-backend-data

