[settings]
; Development-only requirements; production ones come from ../requirements.txt
requirements-in = requirements.txt
requirements-out = requirements-mxdev.txt
constraints-out = constraints-mxdev.txt
; Shared with `make checkout` and the Compose bind mount
default-target = ../sources

[eea.waterhub.policy]
url = https://github.com/eea/eea.waterhub.policy.git
pushurl = git@github.com:eea/eea.waterhub.policy.git
branch = master
extras = test
